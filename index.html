<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,

<title>Love Chat</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  font-family:sans-serif;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  touch-action:manipulation;
  background:#f7f5fb;
}

/* LOGIN PAGE */

#loginPage{
  width:100%;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#eaf6ff,#d7ecff,#ffdff1);
  padding:20px;
}

.box{
  width:100%;
  max-width:340px;
  background:white;
  padding:25px;
  border-radius:25px;
  text-align:center;
  box-shadow:0 0 25px rgba(0,0,0,0.12);
}

.logo{
  width:120px;
  height:120px;
  border-radius:30px;
  margin-bottom:15px;
  object-fit:cover;
}

h2{
  color:#4d8dff;
  margin-bottom:20px;
}

input{
  width:100%;
  padding:14px;
  margin:10px 0;
  border:none;
  border-radius:12px;
  background:#eef6ff;
  color:#333;
  font-size:15px;
  outline:none;
}

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  margin-top:12px;
  font-size:16px;
  cursor:pointer;
}

.gmail-btn{
  background:#5aa9ff;
  color:white;
}

.google-btn{
  background:white;
  border:2px solid #dbe7ff;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}

.google-btn img{
  width:22px;
}

.guest-btn{
  background:linear-gradient(90deg,#ff77c8,#7d7bff);
  color:white;
}

/* HOME PAGE */

#homePage{
  display:none;
  width:100%;
  height:100vh;
  overflow-y:auto;
  overflow-x:hidden;
  background:#f7f5fb;
  padding:20px;
  padding-bottom:110px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.title{
  font-size:38px;
  font-weight:bold;
  color:#20204d;
}

.sub{
  color:#8a8aa0;
  margin-top:8px;
}

.notify{
  width:48px;
  height:48px;
  background:white;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  box-shadow:0 3px 10px rgba(0,0,0,0.08);
  font-size:20px;
}

.banner{
  margin-top:25px;
  background:linear-gradient(135deg,#efe8ff,#f7e6ff);
  border-radius:25px;
  padding:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.banner h3{
  font-size:28px;
  color:#20204d;
}

.banner p{
  color:#777;
  margin-top:10px;
}

.start-btn{
  margin-top:20px;
  width:150px;
  background:linear-gradient(90deg,#7b49ff,#b04cff);
  color:white;
  border:none;
  border-radius:30px;
  padding:14px;
  font-size:16px;
}

.banner img{
  width:110px;
}

.menu{
  display:flex;
  gap:12px;
  margin-top:25px;
}

.card{
  flex:1;
  background:white;
  border-radius:25px;
  padding:18px;
  text-align:center;
  box-shadow:0 3px 10px rgba(0,0,0,0.05);
}

.card img{
  width:65px;
  height:65px;
}

.card h4{
  margin-top:10px;
  font-size:20px;
}

.card p{
  color:#888;
  margin-top:5px;
  font-size:13px;
}

.go{
  width:42px;
  height:42px;
  border-radius:50%;
  margin:auto;
  margin-top:15px;
  background:#ff4fa0;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:22px;
}

.bottom{
  position:fixed;
  left:15px;
  right:15px;
  bottom:15px;
  background:white;
  border-radius:30px;
  display:flex;
  justify-content:space-around;
  padding:15px;
  box-shadow:0 0 15px rgba(0,0,0,0.08);
  z-index:999;
}

.bottom div{
  text-align:center;
  color:#777;
  font-size:14px;
}

.active{
  color:#7d4cff;
  font-weight:bold;
}

/* RESPONSIVE */

@media(max-width:600px){

  .menu{
    flex-direction:column;
  }

  .banner{
    flex-direction:column;
    text-align:center;
  }

  .banner img{
    width:90px;
  }

}

</style>
</head>

<body>

<!-- LOGIN PAGE -->

<div id="loginPage">

<div class="box">

<img

<div class="banner">

<div>

<h3>เพื่อนใหม่สนุกๆ</h3>

</button>

</div>

<img src="https://cdn-icons-png.flaticon.com/512/4712/4712109.png">

</div>

<div class="menu">

</div>"

<div class="card">

<h4>กิจกรรม</h4>

<p>ร่วมสนุกลุ้นรางวัล</p>

</div>

</div>

</div>

<div onclick="window.location.href='mom2.html'">

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {

  apiKey: "AIzaSyC2DbZMOJqGYUKkc2nhYU4B-oX41SYLupU",

  authDomain: "myloginapp-83797.firebaseapp.com",

  projectId: "myloginapp-83797",

  storageBucket: "myloginapp-83797.firebasestorage.app",

  messagingSenderId: "968361508229",

  appId: "1:968361508229:web:ece12a37d93ef48418d8ec",

  measurementId: "G-CTXVMVJB63"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const provider = new GoogleAuthProvider();

function openHome(){

  document.getElementById("loginPage").style.display = "none";

  document.getElementById("homePage").style.display = "block";

}

// LOGIN GMAIL

window.login = function(){

  const email = document.getElementById("email").value;

  const password = document.getElementById("password").value;

  signInWithEmailAndPassword(auth, email, password)

  .then(() => {

    openHome();

  })

  .catch((error) => {

    alert(error.message);

  });

}

// LOGIN GOOGLE

window.googleLogin = function(){

  signInWithPopup(auth, provider)

  .then(() => {

    openHome();

  })

  .catch((error) => {

    alert(error.message);

  });

}

// GUEST LOGIN

window.guestLogin = function(){

  openHome();

}

// กันซูมเข้าออก

document.addEventListener('gesturestart', function (e) {
  e.preventDefault();
});

let lastTouchEnd = 0;

document.addEventListener('touchend', function (event) {

  const now = (new Date()).getTime();

  if (now - lastTouchEnd <= 300) {
    event.preventDefault();
  }

  lastTouchEnd = now;

}, false);

</script>
